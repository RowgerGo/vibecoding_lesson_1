services:
  oa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oa
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      OA_DB_PATH: /app/data/oa.sqlite3
      OA_SESSION_HOURS: ${OA_SESSION_HOURS:-12}
      OA_COOKIE_SECURE: ${OA_COOKIE_SECURE:-0}
      OA_PUBLIC_ORIGIN: ${OA_PUBLIC_ORIGIN:-}
    volumes:
      - oa_data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

volumes:
  oa_data:
